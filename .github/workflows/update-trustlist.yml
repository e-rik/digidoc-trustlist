name: Update trustlist

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: Europe/Tallinn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trustlist:
    name: Update trustlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ca-certificates libxml2-utils
          sudo install -m 0644 certificates/eidas.gov.ie-issuer.pem \
            /usr/local/share/ca-certificates/eidas.gov.ie-issuer.crt
          sudo update-ca-certificates
          mkdir ${{ runner.temp }}/files

      - name: Download files
        run: bash "$WORKSPACE/download-trustlist.sh"
        working-directory: ${{ runner.temp }}/files

      - name: Package files
        run: |
          ls -la ${{ runner.temp }}/files
          tar -czf "${{ runner.temp }}/digidoc-trustlist.tar.gz" -C "${{ runner.temp }}/files"

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          TRUSTLIST_PACKAGE: ${{ runner.temp }}/digidoc-trustlist.tar.gz
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +'%Y-%m-%d %H:%M UTC')"

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Trustlist update - $release_date" \
              --notes "Latest build from commit $GITHUB_SHA." \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              $TRUSTLIST_PACKAGE \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              $TRUSTLIST_PACKAGE \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Trustlist update — $release_date" \
              --notes "Latest build from commit $GITHUB_SHA." \
              --prerelease \
              --latest=false
          fi
