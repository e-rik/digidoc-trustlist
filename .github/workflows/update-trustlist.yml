name: Update trustlist

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: Europe/Tallinn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trustlist:
    name: Update trustlist
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TRUSTLIST_DOWNLOAD_DIR: ${{ runner.temp }}/files

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare folder
        run: mkdir $TRUSTLIST_DOWNLOAD_DIR

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download files
        run: dotnet fsi ./DownloadTrustlist.fsx

      - name: Create package
        run: tar -czf ${{ runner.temp }}/digidoc-trustlist.tar.gz -C $TRUSTLIST_DOWNLOAD_DIR

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +'%Y-%m-%d %H:%M UTC')"

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Trustlist update - $release_date" \
              --notes "Latest build from commit $GITHUB_SHA." \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              ${{ runner.temp }}/digidoc-trustlist.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              ${{ runner.temp }}/digidoc-trustlist.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Trustlist update — $release_date" \
              --notes "Latest build from commit $GITHUB_SHA." \
              --prerelease \
              --latest=false
          fi
